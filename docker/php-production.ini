; Production PHP settings for the ReadPilot container.
;
; The php:8.3-apache image ships without a php.ini, which leaves PHP's built-in
; defaults in force. display_errors defaults to On there, so any warning or
; notice is written straight into the response body. For a JSON API that is
; fatal: the warning text precedes the JSON, and every fetch() on the page dies
; with "Unexpected token '<'" instead of a usable error.
;
; Loaded via PHP_INI_SCAN_DIR in the Dockerfile.

display_errors = Off
display_startup_errors = Off
log_errors = On

; Send logs to stderr so the platform collects them, rather than writing a file
; inside the container that disappears on redeploy.
error_log =
error_reporting = E_ALL

; The application emits JSON with unescaped slashes and unicode; make sure PHP
; does not mangle multibyte content on the way out.
default_charset = "UTF-8"

expose_php = Off

; Uploads. Keep these aligned with the limits quoted in GOOGLE_CLOUD_SETUP.md.
file_uploads = On
upload_max_filesize = 25M
post_max_size = 30M

; Comfortable for the audio upload path and the 8-second AI call.
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; Sessions. httponly and SameSite are set in auth-guard.php; Secure is applied
; there only when the request actually arrived over TLS, so local http dev works.
session.use_strict_mode = 1
session.cookie_httponly = 1