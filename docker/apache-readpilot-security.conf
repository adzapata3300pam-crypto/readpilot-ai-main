# ReadPilot web-root protection (server level).
#
# The stock php:8.3-apache image sets "AllowOverride None", which means a .htaccess
# inside the container is silently ignored. These rules are applied by the server
# itself and cannot be defeated by a missing or unreadable .htaccess. The
# project-root .htaccess carries the same rules for XAMPP development.
#
# This file is loaded from conf-enabled/, which apache2.conf includes *after* its
# own <Directory /var/www/> block, so the AllowOverride override below applies.

ServerTokens Prod
ServerSignature Off

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

# Composer packages are never served.
RedirectMatch 404 ^/vendor/.*$

# Dotfiles: .git, .env, .htaccess itself.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Schema dump, dependency manifests, image and doc build artefacts. database.sql
# in particular contains the seed users table with password hashes.
<FilesMatch "^(database\.sql|composer\.(json|lock)|Dockerfile|php\.ini|readpilot\.secrets.*\.php|.*\.example\.php|.*\.md|\.dockerignore|\.gitignore)$">
    Require all denied
</FilesMatch>

# Nothing in uploads/ may ever execute. Images are served; scripts are not.
<Directory /var/www/html/uploads>
    Options -Indexes
    <FilesMatch "\.(php|phtml|phar|pl|py|cgi|cgi\.pl|sh|htaccess)$">
        Require all denied
    </FilesMatch>
</Directory>

# Private ID-document uploads live outside the document root, but guard the
# in-tree path too in case READPILOT_PRIVATE_DIR is ever pointed here by mistake.
<Directory /var/www/html/uploads/profile>
    <FilesMatch "\.(php|phtml|phar|pl|py|cgi|cgi\.pl|sh|htaccess)$">
        Require all denied
    </FilesMatch>
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By
</IfModule>

DirectoryIndex index.php index.html